function tm(){const g=$('#rg');if(g&&R?.cur&&R.cur.phase==='bid'){const ms=R.status==='paused'?R.rem:R.cur.end-Date.now(),s=Math.max(0,Math.ceil(ms/1000)),n=$('#tn');g.style.strokeDashoffset=276.5*(1-Math.max(0,Math.min(1,ms/bt())));g.style.stroke=s<=3?'var(--r)':s<=6?'var(--y)':'var(--g)';$('#ring').classList.toggle('hot',s<=3&&R.status==='live');if(n.textContent!=s){n.textContent=s;if(R.status==='live')bp(s<=3?900:420,.06)}}
document.querySelectorAll('.dot[data-u]').forEach(d=>{const m=M[d.dataset.u];if(m)d.style.background=st(m)})}setInterval(tm,250);
function squad(t){const m=Object.values(M).find(x=>x.team===t),s=sq(t);modal(`<h3 style="color:${TM[t][0]}">${t} · ${esc(m.name)}</h3><p>Purse ${fmt(purse(t))} · Spent ${fmt(PURSE-purse(t))}</p><table>${s.map((p,i)=>`<tr onclick="pd(${p.p})"><td>${i+1}<td>${esc(p.n)}<td>${RN[p.r]}<td>${fmt(p.pr)}</tr>`).join('')||'<tr><td class=m>No players yet</tr>'}</table>`)}
function pd(i){const p=PL[i],s=R.sold.find(x=>x.p===i);modal(`${av(p,s?.t)}<h3 style="text-align:center">${esc(p.n)}</h3><p style="text-align:center">${RI[p.r]} ${RN[p.r]} · ${p.o?'Overseas':'Indian'}<br>Tier ${p.t} · Rating ${RT[p.t]} · Base ${fmt(BASE[p.t])}<br>${s?`SOLD to <b>${s.t}</b> for ${fmt(s.pr)}`:R.unsold.includes(i)?'Unsold':'Available'}</p><button class=s onclick=drawer()>Back</button>`)}
function drawer(x){if(x)tab=x;const T=Object.values(M).filter(m=>m.team);let b='';
if(tab==='lb')b='<table>'+T.map(m=>({...m,s:score(m.team)})).sort((a,b)=>b.s-a.s).map((m,i)=>`<tr class=fi><td>${i+1}<td>${m.team}<td>${esc(m.name)}<td>${m.s}</tr>`).join('')+'</table>';
else if(tab==='squads')b=T.map(m=>`<details><summary style="color:${TM[m.team][0]}"><b>${m.team}</b> ${esc(m.name)} · ${fmt(purse(m.team))}</summary>${sq(m.team).map(p=>`<div onclick="pd(${p.p})">${esc(p.n)} · ${RN[p.r]} · ${fmt(p.pr)}</div>`).join('')||'<span class=m>empty</span>'}</details>`).join('');
else if(tab==='top')b='<table>'+[...R.sold].sort((a,b)=>b.pr-a.pr).slice(0,10).map((s,i)=>`<tr onclick="pd(${s.p})"><td>${i+1}<td>${esc(PL[s.p].n)}<td>${s.t}<td>${fmt(s.pr)}</tr>`).join('')+'</table>';
else if(tab==='unsold')b=(R.unsold.map(i=>`<div onclick="pd(${i})">${esc(PL[i].n)}</div>`).join('')||'None yet')+'<p class=m>Unsold players are re-auctioned once at the end.</p>';
else if(tab==='hist')b=T.map(m=>{const s=sq(m.team);return`<div><b>${m.team} HISTORY</b>${s.map((p,i)=>`<div>${i+1}. ${esc(p.n)} — ${fmt(p.pr)}</div>`).join('')}<div>Total spent: ${fmt(PURSE-purse(m.team))} · Remaining: ${fmt(purse(m.team))}</div></div><hr>`}).join('');
else if(tab==='media')b=`<p class=m>Upload your own files (you must own the rights). Logos: one per team. Photos: pick many files named like the player, e.g. Virat Kohli.jpg. Sounds: mp3/wav.</p><div id=up class=m></div>`+Object.keys(TM).map(t=>`<div class=row>${lg(t)}<span style="width:3.5em">${t}</span><input type=file accept=image/* onchange="up('logos','${t}',this.files[0])"></div>`).join('')+`<div class=row><b>Player photos</b><input type=file multiple accept=image/* onchange="upP(this.files)"></div>`+['start','bid','sold','unsold','win'].map(k=>`<div class=row><span style="width:4em">${k}</span><input type=file accept=audio/* onchange="up('sounds','${k}',this.files[0])"></div>`).join('');
else if(tab==='ppl')b='<p class=m>Remove a person from this auction. They cannot rejoin this room.</p>'+(Object.values(M).filter(m=>m.name!==R.host).map(m=>`<div class=row style="border-bottom:1px solid #2a335866;padding:6px 0"><b style="flex:1">${esc(m.name)}</b>${m.team?`<span class=chip style="background:${bgT(m.team)}">${m.team}</span>`:'<span class=m>👀 spectator</span>'}<button class=s onclick="kick('${m.name}')">✖ Remove</button></div>`).join('')||'<p class=m>No one else is here yet.</p>');else if(tab==='snd')b=snd();else b=RULES;
modal(`<div class=tabs>${[['lb','📊 Leaderboard'],['squads','🏆 Squads'],['top','💰 Highest Bids'],['unsold','❌ Unsold'],['hist','📜 History'],['rules','📖 Rules'],['snd','🔊 Sound'],...(R.host===U?[['ppl','🚫 Remove players']]:[])].map(x=>`<button class="${tab===x[0]?'':'s'}" onclick="drawer('${x[0]}')">${x[1]}</button>`).join('')}</div>${b}<p><button class=s onclick=bye()>🚪 Exit</button></p>`)}
</script></body></html>
